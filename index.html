<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1311">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="PAM Word Challenge — Public Authority of Manpower, IT Department">
  <title>PAM Word Challenge · تحدي الكلمات</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body data-screen="home">

<div class="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="pattern"></div>
</div>

<div id="app">
  <!-- ─── Top bar ─── -->
  <header class="topbar">
    <div class="brand">
      <div class="logo-badge"><img id="brand-logo" src="assets/logo.png" alt=""></div>
      <div class="brand-text">
        <strong data-i18n="org_name"></strong>
        <span data-i18n="dept_name"></span>
      </div>
    </div>
    <div class="top-actions">
      <span class="demo-badge" id="demo-badge" data-i18n="demo_badge" hidden></span>
    </div>
  </header>
  <div class="flag-ribbon top" aria-hidden="true"></div>

  <main id="screens">
    <!-- ═════════ HOME / ATTRACT ═════════ -->
    <section class="screen" id="screen-home" data-screen="home">
      <div class="ambient" id="ambient" aria-hidden="true"></div>

      <div class="hero" id="hero">
        <div class="logo-ring"><div class="logo-badge hero-logo"><img id="hero-logo" src="assets/logo.png" alt=""></div></div>
        <div class="hero-badge" data-i18n="hero_badge"></div>
        <h1 class="hero-title" id="hero-title"></h1>
        <p class="hero-sub" id="hero-sub"></p>
        <div class="demo-row" id="demo-row" aria-hidden="true"></div>
        <button class="cta" id="btn-start" type="button">
          <span class="cta-label" data-i18n="tap_to_start"></span>
          <span class="cta-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
        <div class="legend">
          <div><span class="tile" data-state="correct">✓</span><span data-i18n="legend_correct"></span></div>
          <div><span class="tile" data-state="present">↔</span><span data-i18n="legend_present"></span></div>
          <div><span class="tile" data-state="absent">✕</span><span data-i18n="legend_absent"></span></div>
        </div>
      </div>

      <div class="glass champions-card" id="home-champions">
        <div class="card-head">
          <h2>
            <span class="head-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></span>
            <span data-i18n="champions"></span>
          </h2>
          <span class="season-chip" id="season-chip"></span>
        </div>
        <ol class="champ-list" id="home-champ-list"></ol>
        <button class="link-btn" id="btn-all-champions" type="button">
          <span data-i18n="view_all"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>

    <!-- ═════════ REGISTER ═════════ -->
    <section class="screen gone" id="screen-register" data-screen="register">
      <form class="glass reg-card" id="reg-form" novalidate autocomplete="off">
        <div class="reg-head">
          <h2 data-i18n="reg_title"></h2>
          <p data-i18n="reg_sub"></p>
        </div>
        <label class="field" id="f-name">
          <span data-i18n="full_name"></span>
          <input id="in-name" type="text" maxlength="80" autocomplete="off" autocorrect="off" spellcheck="false"
                 autocapitalize="words" enterkeyhint="next" data-i18n-ph="full_name_ph">
          <small class="err" id="err-name"></small>
        </label>
        <label class="field" id="f-id">
          <span data-i18n="id_number"></span>
          <input id="in-id" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="20" autocomplete="off"
                 enterkeyhint="go" dir="ltr" data-i18n-ph="id_number_ph">
          <small class="err" id="err-id"></small>
        </label>
        <div class="form-alert" id="reg-alert" hidden></div>
        <div class="reg-actions">
          <button class="btn btn-primary btn-xl" id="btn-reg" type="submit">
            <span data-i18n="start_challenge"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <button class="btn btn-ghost" id="btn-reg-back" type="button" data-i18n="back"></button>
        </div>
        <p class="privacy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <span data-i18n="privacy_note"></span>
        </p>
      </form>

      <div class="glass rules-card">
        <h3>
          <span class="head-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01"/></svg></span>
          <span data-i18n="how_title"></span>
        </h3>
        <ul class="rules" id="rules"></ul>
        <div class="examples" id="examples"></div>
      </div>
    </section>

    <!-- ═════════ GAME ═════════ -->
    <section class="screen gone" id="screen-game" data-screen="game">
      <div class="game-info">
        <div class="game-head">
          <div class="player-chip">
            <div class="avatar" id="g-avatar"></div>
            <div class="meta"><strong id="g-name"></strong><span id="g-sub"></span></div>
          </div>
          <div class="timer" id="g-timer" hidden>
            <svg viewBox="0 0 44 44"><circle class="track" r="20" cx="22" cy="22"/><circle class="prog" id="g-timer-prog" r="20" cx="22" cy="22"/></svg>
            <span id="g-timer-text">0:00</span>
          </div>
          <button class="icon-btn hint" id="btn-hint" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></svg>
            <span data-i18n="hint"></span>
          </button>
          <button class="icon-btn" id="btn-quit" type="button" aria-label="Quit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="category" id="g-category" hidden>
          <span class="cat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span>
          <span class="cat-txt"><small data-i18n="category"></small><strong id="g-category-name"></strong></span>
        </div>
        <figure class="clue loading" id="g-image" role="button" tabindex="0" hidden>
          <img class="clue-bg" id="g-image-bg" alt="" aria-hidden="true">
          <img class="clue-img" id="g-image-img" alt="">
          <span class="clue-zoom" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          </span>
          <figcaption class="clue-cap" id="g-image-cap">
            <span class="cat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span>
            <span class="cat-txt"><small data-i18n="category"></small><strong id="g-image-cat"></strong></span>
          </figcaption>
        </figure>
        <div class="attempts" id="g-attempts"></div>
        <div class="hint-banner" id="hint-banner" hidden></div>
      </div>
      <div class="board-wrap"><div class="board" id="board"></div></div>
      <div class="keyboard" id="keyboard"></div>
    </section>

    <!-- ═════════ LEADERBOARD ═════════ -->
    <section class="screen gone" id="screen-board" data-screen="board">
      <div class="board-top">
        <button class="icon-btn" id="btn-board-back" type="button" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h2>
          <span class="head-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></span>
          <span data-i18n="champions"></span>
        </h2>
      </div>
      <div class="tabs" id="lb-tabs">
        <button type="button" data-period="today" data-i18n="tab_today"></button>
        <button type="button" data-period="season" data-i18n="tab_season"></button>
        <button type="button" data-period="all" data-i18n="tab_all"></button>
      </div>
      <div class="podium" id="podium"></div>
      <ol class="rank-list" id="rank-list"></ol>
    </section>
  </main>

  <footer class="foot">
    <span class="credit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.6-3 8.3-7 10-4-1.700-7-5.400-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
      <span data-i18n="credit"></span>
    </span>
    <span class="copy" id="footer"></span>
  </footer>
</div>

<!-- ═════════ RESULT ═════════ -->
<div class="overlay" id="result" hidden>
  <div class="glass result-card sheet" id="result-card" role="dialog" aria-modal="true">
    <div class="r-icon" id="r-icon"></div>
    <h2 id="r-title"></h2>
    <p class="r-sub" id="r-sub"></p>
    <div class="answer-row" id="r-word"></div>
    <div class="score-big" id="r-score-box"><span id="r-score">0</span><small data-i18n="pts"></small></div>
    <div class="breakdown" id="r-breakdown"></div>
    <div class="r-stats">
      <div class="stat"><b id="r-attempts">–</b><span data-i18n="stat_attempts"></span></div>
      <div class="stat"><b id="r-time">–</b><span data-i18n="stat_time"></span></div>
      <div class="stat hl"><b id="r-rank">–</b><span data-i18n="stat_rank"></span></div>
    </div>
    <div class="r-actions">
      <button class="btn btn-primary" id="r-again" type="button" data-i18n="play_again"></button>
      <button class="btn btn-ghost" id="r-finish" type="button" data-i18n="finish"></button>
    </div>
    <div class="autoclose"><div class="track"><div class="bar" id="r-bar"></div></div><span id="r-count"></span></div>
  </div>
</div>

<!-- ═════════ IMAGE LIGHTBOX ═════════ -->
<div class="overlay lightbox" id="lightbox" hidden>
  <figure class="lb-sheet sheet">
    <img id="lb-img" alt="">
    <figcaption class="lb-cap" id="lb-cap"></figcaption>
  </figure>
  <button class="lb-close" type="button" data-i18n-title="image_close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
</div>

<!-- ═════════ CONFIRM ═════════ -->
<div class="overlay" id="confirm" hidden>
  <div class="glass confirm-card sheet" role="alertdialog" aria-modal="true">
    <h3 id="c-title"></h3>
    <p id="c-text"></p>
    <div class="r-actions">
      <button class="btn btn-primary" id="c-ok" type="button"></button>
      <button class="btn btn-ghost" id="c-cancel" type="button"></button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<canvas id="confetti"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/fx.js"></script>
<script src="js/api.js"></script>
<script src="js/game.js"></script>
</body>
</html>
